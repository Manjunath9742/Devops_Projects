version: '3.8'

services:
  # MySQL Database service
  db:
    image: mysql:8.0
    container_name: todo-mysql-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: "1234"
      MYSQL_DATABASE: "tododb"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql

  # Backend Node.js service
  backend:
    image: manjuns2012/todo-backend:latest
    container_name: todo-backend-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - DB_HOST=db
      - DB_USER=root
      - DB_PASSWORD=1234
      - DB_NAME=tododb
      - DB_PORT=3306
      - PORT=5000
    depends_on:
      - db

  # Frontend Nginx service
  frontend:
    image: manjuns2012/todo-frontend:latest
    container_name: todo-frontend-web
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql-data:
