trigger:
- main

resources:
- repo: self

variables:
  # 1. Docker Hub Service Connection name in Azure DevOps
  dockerRegistryServiceConnection: 'dockerhub-conn'
  
  # 2. SSH Service Connection name in Azure DevOps pointing to your Azure VM
  sshServiceConnection: 'vm-ssh-connection'
  
  # Docker Hub repositories
  imageRepositoryBackend: 'manjuns2012/todo-backend'
  imageRepositoryFrontend: 'manjuns2012/todo-frontend'
  
  tag: '$(Build.BuildId)'

stages:
# -----------------------------------------------------------
# STAGE 1: Build and Push both Frontend and Backend Images
# -----------------------------------------------------------
- stage: Build
  displayName: Build and Push Images
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: ubuntu-latest
    steps:
    # Build & Push Backend Image
    - task: Docker@2
      displayName: Build and Push Backend Image
      inputs:
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(imageRepositoryBackend)'
        command: 'buildAndPush'
        dockerfile: '$(Build.SourcesDirectory)/backend/Dockerfile'
        tags: |
          $(tag)
          latest

    # Build & Push Frontend Image
    - task: Docker@2
      displayName: Build and Push Frontend Image
      inputs:
        containerRegistry: '$(dockerRegistryServiceConnection)'
        repository: '$(imageRepositoryFrontend)'
        command: 'buildAndPush'
        dockerfile: '$(Build.SourcesDirectory)/frontend/Dockerfile'
        tags: |
          $(tag)
          latest

# -----------------------------------------------------------
# STAGE 2: Deploy to your Azure VM via SSH
# -----------------------------------------------------------
- stage: Deploy
  displayName: Deploy to VM
  dependsOn: Build
  condition: succeeded()
  jobs:
  - job: Deploy
    displayName: Deploy
    pool:
      vmImage: ubuntu-latest
    steps:
    # Connects to your Azure VM via SSH and runs deployment commands
    - task: SSH@0
      displayName: 'Run deployment commands on VM'
      inputs:
        sshEndpoint: '$(sshServiceConnection)'
        runOptions: 'inline'
        inline: |
          # 1. Clone the repository if it doesn't exist on the VM yet
          if [ ! -d "$HOME/Devops_Projects" ]; then
            echo "--- Repository not found on VM. Cloning it now... ---"
            git clone https://github.com/Manjunath9742/Devops_Projects.git "$HOME/Devops_Projects"
          fi
          
          # 2. Navigate to the project directory
          cd "$HOME/Devops_Projects"
          
          # 3. Pull the latest code changes
          git pull origin main
          
          # 4. Pull the latest images from Docker Hub
          docker compose pull
          
          # 5. Re-launch the containers in background mode
          docker compose up -d